name: Docker Multi-Arch Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Login to Aliyun Registry
        run: |
          echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | skopeo login ${{ secrets.ALIYUN_REGISTRY }} \
            -u "${{ secrets.ALIYUN_REGISTRY_USER }}" --password-stdin

      - name: Sync Images
        run: |
          # 检查 images.txt 是否存在
          if [ ! -f "images.txt" ]; then
            echo "Error: images.txt not found!"
            exit 1
          fi

          # 循环读取其中的镜像
          while IFS= read -r source_image || [ -n "$source_image" ]; do
            # 忽略空行和注释行
            [[ -z "$source_image" || "$source_image" =~ ^# ]] && continue
            
            # 去除前后的空格
            source_image=$(echo "$source_image" | xargs)
            
            echo "--------------------------------------------------"
            echo "Processing image: $source_image"
            
            # 提取镜像名称和标签 (例如 library/nginx:latest 或 ubuntu:20.04)
            if [[ "$source_image" == */*/* ]]; then
              image_name_tag=$(echo "$source_image" | cut -d'/' -f2-)
            elif [[ "$source_image" == */* ]]; then
              image_name_tag="$source_image"
            else
              image_name_tag="library/$source_image"
            fi
            
            # 目标阿里云镜像地址
            target_image="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAME_SPACE }}/${image_name_tag}"
            echo "Target Aliyun image: $target_image"
            
            # 检查目标镜像是否已存在（去重检查）
            if skopeo inspect docker://$target_image > /dev/null 2>&1; then
              echo "✅ Image $target_image already exists. Skipping..."
              continue
            fi
            
            # 执行多架构同步 (--all 会包含 amd64, arm64 等所有架构)
            echo "🚀 Syncing $source_image to $target_image ..."
            if skopeo copy --all docker://$source_image docker://$target_image; then
              echo "🎉 Successfully synced $image_name_tag"
            else
              echo "❌ Failed to sync $image_name_tag"
              exit 1
            fi

          done < images.txt
